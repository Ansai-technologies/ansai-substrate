# Ansai substrate — LiteLLM gateway config.
#
# Model IDs verified live 2026-09-24 (do not change without re-verifying):
#   DeepSeek: deepseek-chat, deepseek-reasoner
#   Gemini:   gemini-3-flash-preview (primary vision/fallback),
#             gemini-3.5-flash-lite (cheapest fallback)
# NOTE: gemini-2.5-flash-lite is listed by the API but returns 404
# "no longer available to new users" — the API itself redirects to
# gemini-3.5-flash-lite. Preview IDs can rotate — if calls start 404ing,
# list GET /v1beta/models and confirm against provider docs first.
#
# Budget posture: DeepSeek balance is $2.59 (dev-scale, verified 2026-09-24).
# Proxy-wide hard cap below leaves headroom; per-group caps live on virtual
# keys created at runtime (see COSTS.md + gateway/README.md).

model_list:
  - model_name: workhorse
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 2000 # guardrail: routine agent loops should not need more

  - model_name: thinker
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 4000 # reasoning traces are longer; still capped

  - model_name: vision
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 2000

  - model_name: vision-cheap
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 2000

  - model_name: judge
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 1000 # verdicts are short; cap keeps eval spend tiny

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # NOTE (verified on litellm 1.102.1): the proxy REFUSES to boot on sqlite —
  # "DATABASE_URL uses unsupported scheme 'sqlite'". Virtual keys, per-group
  # spend caps, and spend tracking require PostgreSQL. Point this at Supabase
  # (project already on Supabase) or the postgres service in docker-compose.yml.
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Tight budget: hard proxy cap at $2.00 of the $2.59 DeepSeek balance.
  # Per-group spend caps are enforced on virtual keys (workhorse $1.20 /
  # thinker $0.30 / vision $0.30 / judge $0.20) — create them post-boot,
  # procedure in COSTS.md. Alerts at 50% and 80% per key.
  max_budget: 2.0
  # Budget alerting: LiteLLM proxy supports alert integrations (Slack / email /
  # webhook) for budget thresholds — configure `alerting:` per the current
  # LiteLLM docs and set 50%/80% thresholds on each virtual key.
  # alerting: ["slack"]

# Failover: the proxy passes router_settings -> Router(fallbacks=...).
# NOTE (verified on litellm 1.102.1): a TOP-LEVEL `fallbacks:` key is silently
# IGNORED — it must live under router_settings, otherwise no failover happens
# (the proxy reports "Available Model Group Fallbacks=None").
# Retried on rate-limit (429), connection errors and 5xx from the provider.
router_settings:
  fallbacks:
    - workhorse: ["vision", "vision-cheap"]
    - thinker: ["vision", "vision-cheap"]
    - vision: ["vision-cheap"]
