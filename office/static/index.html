<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ansai Office — live agent floor</title>
<style>
  :root{
    --bg:#faf8f4; --card:#ffffff; --ink:#2b2620; --muted:#8a8177;
    --line:#e9e2d6; --accent:#4f46e5; --gold:#b45309; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;
    background:var(--card);border-bottom:1px solid var(--line);}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  #conn{width:9px;height:9px;border-radius:50%;background:#d6cfc2;margin-left:auto}
  #conn.live{background:#22c55e}
  main{display:flex;gap:16px;padding:16px;max-width:1340px;margin:0 auto;
    align-items:flex-start}
  #stage{flex:1;min-width:0;background:linear-gradient(180deg,#fdfcf9,#f7f3ea);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 2px 12px rgba(60,50,30,.05)}
  #scene{width:100%;height:600px;cursor:grab}
  #scene canvas{display:block;width:100%;height:100%}
  aside{width:330px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;box-shadow:0 2px 12px rgba(60,50,30,.05)}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 10px}
  .agent{display:flex;gap:10px;align-items:center;padding:8px 0;
    border-top:1px solid var(--line)}
  .agent:first-of-type{border-top:none}
  .ava{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;
    border:2px solid var(--line);background:#f4f1ea}
  .agent .who{flex:1;min-width:0}
  .agent .who b{font-size:13.5px;display:block}
  .agent .who span{font-size:11.5px;color:var(--muted);display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:600;
    text-transform:capitalize;flex-shrink:0}
  .pill.idle{background:#eef2ff;color:#4f46e5}
  .pill.working{background:#e0f2fe;color:#0369a1}
  .pill.thinking{background:#fef3c7;color:#92400e}
  .pill.error{background:#fee2e2;color:#b91c1c}
  #feed{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .ev{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
  .ev .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center}
  .ev b{color:var(--ink);font-weight:600}
  #chatlog{height:220px;overflow-y:auto;display:flex;flex-direction:column;
    gap:8px;margin-bottom:10px}
  .msg{font-size:13px;line-height:1.45;padding:8px 11px;border-radius:12px;
    max-width:94%;word-wrap:break-word}
  .msg.you{background:#eef2ff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.you b.at{font-weight:700}
  .msg.them{background:#f4f1ea;align-self:flex-start;border-bottom-left-radius:4px}
  .msg.them .head{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .msg.them .head img{width:22px;height:22px;border-radius:50%;object-fit:cover}
  .msg.them .head b{font-size:11.5px}
  .msg.typing{background:#f4f1ea;align-self:flex-start;border-bottom-left-radius:4px;
    display:flex;align-items:center;gap:7px}
  .msg.typing img{width:22px;height:22px;border-radius:50%;object-fit:cover}
  .tdots{display:inline-flex;gap:4px;padding:4px 2px}
  .tdots i{width:7px;height:7px;border-radius:50%;background:#a8a094;
    animation:tblink 1.1s infinite}
  .tdots i:nth-child(2){animation-delay:.18s}
  .tdots i:nth-child(3){animation-delay:.36s}
  @keyframes tblink{0%,100%{opacity:.25;transform:translateY(0)}
    50%{opacity:1;transform:translateY(-3px)}}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);
    font-size:11.5px;padding:2px 8px}
  .msg.you b.at-all,.msg.them b.at-all{background:linear-gradient(135deg,#4f46e5,#b45309);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  #approvals{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  #approvals:empty{display:none}
  .appr{border:1px solid var(--line);border-left:4px solid #8a8177;border-radius:10px;
    padding:8px 10px;font-size:12px;background:#fffdf8}
  .appr .kind{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .appr .sum{margin:3px 0;color:var(--ink);line-height:1.4}
  .appr .pay{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;
    color:var(--muted);background:#f7f4ec;border-radius:6px;padding:4px 6px;
    margin-bottom:6px;word-break:break-all}
  .appr .row{display:flex;gap:8px;align-items:center}
  .appr .meta{font-size:10.5px;color:var(--muted);flex:1}
  .appr button{border:none;border-radius:8px;padding:6px 12px;font-size:12px;
    font-weight:600;cursor:pointer;font-family:inherit}
  .appr button.ok{background:#16a34a;color:#fff}
  .appr button.no{background:#f4f1ea;color:#b91c1c}
  #apprBadge{display:none;background:#b45309;color:#fff;font-size:10px;
    border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
  #apprBadge.show{display:inline-block}
  #hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  #hint code{background:#f4f1ea;border:1px solid var(--line);border-radius:6px;
    padding:1px 5px;font-size:11px;color:var(--ink)}
  #composer{display:flex;gap:8px}
  #chatin{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  #chatin:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}
  #send{border:none;background:var(--accent);color:#fff;border-radius:10px;
    padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  #send:disabled{opacity:.5;cursor:default}
  @media (max-width:980px){main{flex-direction:column}aside{width:100%}}
</style>
<script type="importmap">
{"imports":{"three":"./static/vendor/three.module.js"}}
</script>
</head>
<body>
<header>
  <div>
    <h1>Ansai Office</h1>
    <p>live agent floor — the Baraza at work</p>
  </div>
  <div id="conn" title="SSE connection"></div>
</header>
<main>
  <div id="stage"><div id="scene"></div></div>
  <aside>
    <div class="card"><h2>Council</h2><div id="agents"></div></div>
    <div class="card"><h2>Activity</h2><div id="feed"></div></div>
    <div class="card"><h2>Baraza chat<span id="apprBadge"></span></h2>
      <div id="approvals"></div>
      <div id="chatlog"></div>
      <div id="hint">Type <code>@name</code> to call an agent, <code>@everyone</code>
        for the whole Baraza (no @ = Jabari answers). Agents can use tools now —
        reads run free, writes pop an approval card here first.</div>
      <div id="composer">
        <input id="chatin" placeholder="@tangaza what's the plan today?" autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';

/* ---------------- roster ---------------- */
const ROSTER = {
  tangaza:{name:"Tangaza", role:"Marketing & Sales",    color:"#4f46e5"},
  fundi:  {name:"Fundi",   role:"Product & Engineering",color:"#0d9488"},
  jabari: {name:"Jabari",  role:"Chair / supervisor",   color:"#b45309"},
  sanaa:  {name:"Sanaa",   role:"Studios / creative",   color:"#db2777"},
  akiba:  {name:"Akiba",   role:"Finance & Ops",        color:"#16a34a"},
  dadisi: {name:"Dadisi",  role:"Labs scout",           color:"#7c3aed"},
};
// desk spot per agent: character stands on the +z side of their desk
const WORKSPOTS = {
  jabari: {x:-3.6, z: 2.2, rot:-0.28, big:true},
  tangaza:{x:-1.25,z: 0.9, rot:0},
  fundi:  {x: 1.25,z: 0.9, rot:0},
  sanaa:  {x:-1.25,z:-1.5, rot:0},
  akiba:  {x: 1.25,z:-1.5, rot:0},
  dadisi: {x: 3.6, z:-2.4, rot:0.22, lab:true},
};

/* ---------------- renderer / camera ---------------- */
const stage = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xf8f5ee, 1);
stage.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
// classic isometric: 45° azimuth, ~35.26° elevation
camera.position.set(7.5, 7.5, 7.5);
camera.lookAt(0, 0.2, 0);

function fitCamera(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const halfH = 5.6, aspect = w / h;
  camera.left = -halfH * aspect; camera.right = halfH * aspect;
  camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', fitCamera);

const scene = new THREE.Scene();

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xe8dfd0, 0.85));
const sun = new THREE.DirectionalLight(0xfff7e8, 1.6);
sun.position.set(6, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xe8f0ff, 0.35);
fill.position.set(-6, 5, -4);
scene.add(fill);

/* ---------------- helpers ---------------- */
function mat(color, rough=0.9, metal=0){
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function box(w, h, d, color, x=0, y=0, z=0, opts={}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts.rough ?? 0.9));
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false; m.receiveShadow = opts.receive !== false;
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rz) m.rotation.z = opts.rz;
  if (opts.rx) m.rotation.x = opts.rx;
  (opts.parent || scene).add(m);
  return m;
}
function cyl(rt, rb, h, color, x=0, y=0, z=0, opts={}){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, opts.seg || 20),
    mat(color, opts.rough ?? 0.9));
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false; m.receiveShadow = opts.receive !== false;
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.rz) m.rotation.z = opts.rz;
  (opts.parent || scene).add(m);
  return m;
}
// floating text label: pill with agent-color bg, white text
function makeLabel(text, bg){
  const fs = 46, pad = 30;
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = `600 ${fs}px -apple-system, "Segoe UI", sans-serif`;
  const tw = Math.ceil(g.measureText(text).width);
  c.width = tw + pad * 2; c.height = fs + pad * 1.4;
  const r = c.height / 2;
  g.beginPath();
  g.moveTo(r, 0); g.arcTo(c.width, 0, c.width, c.height, r);
  g.arcTo(c.width, c.height, 0, c.height, r);
  g.arcTo(0, c.height, 0, 0, r); g.arcTo(0, 0, c.width, 0, r);
  g.closePath();
  g.fillStyle = bg; g.fill();
  g.font = `600 ${fs}px -apple-system, "Segoe UI", sans-serif`;
  g.fillStyle = '#ffffff'; g.textBaseline = 'middle';
  g.fillText(text, pad, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  const k = 0.0062;
  sp.scale.set(c.width * k, c.height * k, 1);
  return sp;
}
// small "typing" bubble shown above a desk while an agent works
function makeTypingBubble(color){
  const c = document.createElement('canvas');
  c.width = 120; c.height = 64;
  const g = c.getContext('2d');
  g.beginPath();
  const r = 30;
  g.moveTo(r, 2); g.arcTo(118, 2, 118, 62, r); g.arcTo(118, 62, 2, 62, r);
  g.arcTo(2, 62, 2, 2, r); g.arcTo(2, 2, 118, 2, r);
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.fill();
  g.strokeStyle = color; g.lineWidth = 4; g.stroke();
  g.fillStyle = color;
  for (let i = 0; i < 3; i++){ g.beginPath(); g.arc(34 + i * 26, 32, 8, 0, 7); g.fill(); }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(0.72, 0.38, 1);
  sp.visible = false;
  return sp;
}

/* ---------------- dollhouse shell ---------------- */
// diorama base slab + floor
box(11.9, 0.5, 9.3, 0xe2dbc9, 0, -0.55, 0, {rough:1});
box(11, 0.3, 8.4, 0xf0eadd, 0, -0.15, 0, {rough:1, cast:false});
// two walls (cutaway)
box(11, 3.4, 0.3, 0xf7f4ec, 0, 1.7, -4.05, {rough:1});            // back
box(0.3, 3.4, 8.4, 0xfbf9f3, -5.35, 1.7, 0, {rough:1});           // left
// rug under the central pod
{
  const rug = new THREE.Mesh(new THREE.CircleGeometry(2.5, 48), mat(0xe6d3b8, 1));
  rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.012, -0.3);
  rug.receiveShadow = true; scene.add(rug);
  const rug2 = new THREE.Mesh(new THREE.CircleGeometry(2.0, 48), mat(0xefe0c8, 1));
  rug2.rotation.x = -Math.PI / 2; rug2.position.set(0, 0.016, -0.3);
  rug2.receiveShadow = true; scene.add(rug2);
}
// wall art: Ansai indigo + gold
{
  box(1.7, 1.05, 0.07, 0xb45309, 0.5, 2.15, -3.86, {rough:0.6}); // gold frame
  const c = document.createElement('canvas'); c.width = 256; c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#4f46e5'; g.fillRect(0, 0, 256, 160);
  g.strokeStyle = '#d4a94e'; g.lineWidth = 6;
  g.beginPath(); g.arc(128, 80, 52, 0, 7); g.stroke();
  g.fillStyle = '#ffffff'; g.font = '700 64px -apple-system, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('A', 128, 84);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const art = new THREE.Mesh(new THREE.PlaneGeometry(1.55, 0.95),
    new THREE.MeshStandardMaterial({map:tex, roughness:0.8}));
  art.position.set(0.5, 2.15, -3.815); scene.add(art);
}
// window with sky panes
{
  box(1.9, 1.5, 0.08, 0xd8cfba, 3.35, 2.0, -3.87, {rough:0.8});
  const pane = mat(0xd7e8f7, 0.4);
  for (const [px, py] of [[-0.42, 0.32], [0.42, 0.32], [-0.42, -0.32], [0.42, -0.32]]){
    const p = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.6), pane);
    p.position.set(3.35 + px, 2.0 + py, -3.815); scene.add(p);
  }
  box(0.06, 1.5, 0.1, 0xd8cfba, 3.35, 2.0, -3.82, {cast:false});
  box(1.9, 0.06, 0.1, 0xd8cfba, 3.35, 2.0, -3.82, {cast:false});
}
// whiteboard "BARAZA" near Jabari
{
  box(2.6, 1.5, 0.08, 0xcabf9f, -3.3, 2.0, -3.87, {rough:0.7});
  const c = document.createElement('canvas'); c.width = 512; c.height = 288;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 288);
  g.fillStyle = '#8a8177'; g.font = '700 40px -apple-system, sans-serif';
  g.textAlign = 'center';
  g.fillText('B A R A Z A', 256, 58);
  g.strokeStyle = 'rgba(79,70,229,.55)'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(40, 200);
  g.bezierCurveTo(110, 120, 180, 230, 250, 160);
  g.bezierCurveTo(300, 110, 360, 190, 460, 130); g.stroke();
  g.fillStyle = 'rgba(180,83,9,.45)';
  [150, 190, 230, 270].forEach((h, i) => g.fillRect(330 + i * 34, 240 - h * 0.5, 22, h * 0.5));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const wb = new THREE.Mesh(new THREE.PlaneGeometry(2.45, 1.38),
    new THREE.MeshStandardMaterial({map:tex, roughness:0.6}));
  wb.position.set(-3.3, 2.0, -3.815); scene.add(wb);
}

/* ---------------- furniture ---------------- */
function makePlant(x, z, s=1){
  const g = new THREE.Group();
  cyl(0.16 * s, 0.12 * s, 0.26 * s, 0xc96f4a, 0, 0.13 * s, 0, {parent:g});
  cyl(0.17 * s, 0.17 * s, 0.04 * s, 0x8a5a3a, 0, 0.27 * s, 0, {parent:g});
  const greens = [0x6aa84f, 0x7fbf62, 0x5d9c46];
  for (let i = 0; i < 5; i++){
    const a = (i / 5) * Math.PI * 2;
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.13 * s, 0.5 * s, 8),
      mat(greens[i % 3], 0.95));
    leaf.position.set(Math.cos(a) * 0.09 * s, (0.5 + (i % 2) * 0.12) * s, Math.sin(a) * 0.09 * s);
    leaf.rotation.z = Math.cos(a) * 0.35; leaf.rotation.x = Math.sin(a) * 0.35;
    leaf.castShadow = true; g.add(leaf);
  }
  g.position.set(x, 0, z); scene.add(g);
  return g;
}
function makeDesk(x, z, accent, {big=false, ry=0}={}){
  const g = new THREE.Group();
  const w = big ? 2.5 : 1.9, d = big ? 1.15 : 0.95;
  box(w, 0.12, d, 0xf3ede0, 0, 0.78, 0, {parent:g});                    // top
  for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
    box(0.09, 0.72, 0.09, 0xd9cfae, lx * (w / 2 - 0.08), 0.36, lz * (d / 2 - 0.08), {parent:g});
  box(1.15, 0.025, 0.5, accent, 0, 0.855, 0.08, {parent:g, cast:false}); // desk mat
  box(0.55, 0.035, 0.2, 0xe3dccb, -0.1, 0.86, 0.1, {parent:g, cast:false}); // keyboard
  cyl(0.05, 0.07, 0.3, 0xb9ad94, 0, 1.0, -0.18, {parent:g});             // monitor stand
  const scr = box(0.9, 0.56, 0.06, 0x2e3440, 0, 1.32, -0.2, {parent:g, rough:0.5});
  scr.rotation.x = -0.08;
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.48),
    new THREE.MeshStandardMaterial({color:0x1f2937, emissive:0x334155, emissiveIntensity:0.5, roughness:0.4}));
  glow.position.set(0, 1.322, -0.168); glow.rotation.x = -0.08; g.add(glow);
  box(0.9, 0.05, 0.07, accent, 0, 1.03, -0.2, {parent:g, cast:false});   // accent bar
  // chair behind desk (+z side)
  const ch = new THREE.Group();
  box(0.5, 0.09, 0.5, 0xcfc6b2, 0, 0.52, 0, {parent:ch});
  box(0.5, 0.6, 0.09, 0xcfc6b2, 0, 0.95, 0.24, {parent:ch});
  cyl(0.045, 0.045, 0.5, 0xa89e88, 0, 0.26, 0, {parent:ch});
  ch.position.set(0, 0, 0.95); g.add(ch);
  // mug in accent color
  cyl(0.06, 0.055, 0.12, accent, w / 2 - 0.3, 0.9, 0.22, {parent:g, seg:12});
  g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  return g;
}
function makeFloorLamp(x, z){
  const g = new THREE.Group();
  cyl(0.16, 0.2, 0.06, 0xa89e88, 0, 0.03, 0, {parent:g});
  cyl(0.035, 0.035, 2.1, 0x8a8177, 0, 1.1, 0, {parent:g});
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.4, 20, 1, true),
    new THREE.MeshStandardMaterial({color:0xf5ecd8, roughness:0.9, side:THREE.DoubleSide}));
  shade.position.y = 2.2; shade.castShadow = true; g.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12),
    new THREE.MeshStandardMaterial({color:0xffe9b8, emissive:0xffc978, emissiveIntensity:1.6}));
  bulb.position.y = 2.12; g.add(bulb);
  const pl = new THREE.PointLight(0xffd9a0, 6, 7, 1.6);
  pl.position.y = 2.05; g.add(pl);
  g.position.set(x, 0, z); scene.add(g);
}
function makePendant(x, z){
  const g = new THREE.Group();
  cyl(0.015, 0.015, 1.6, 0x8a8177, 0, 3.4, 0, {parent:g, cast:false});

// Minecraft-style box humanoids: portrait-cube head, colored torso, limbs that
// swing from shoulder/hip pivots. They walk the floor: idle -> desk, working
// -> open-floor task spot, with turn-to-face-travel and contact shadows.
const loader = new THREE.TextureLoader();
const TASKSPOTS = {
  jabari: {x:-1.8, z:-0.9},
  tangaza:{x: 1.8, z:-0.9},
  fundi:  {x: 0.6, z: 1.3},
  sanaa:  {x:-0.6, z: 1.3},
  akiba:  {x: 1.8, z: 0.8},
  dadisi: {x:-1.8, z: 0.8},
};
function makeContactShadow(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g2 = c.getContext('2d');
  const grad = g2.createRadialGradient(64, 64, 8, 64, 64, 62);
  grad.addColorStop(0, 'rgba(40,32,22,0.55)');
  grad.addColorStop(1, 'rgba(40,32,22,0)');
  g2.fillStyle = grad; g2.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.95),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0.32, depthWrite:false}));
  m.rotation.x = -Math.PI / 2;
  return m;
}
function makeVoxel(id, meta){
  const group = new THREE.Group();
  const color = new THREE.Color(meta.color);
  const dark = color.clone().multiplyScalar(0.55);
  const lam = o => new THREE.MeshLambertMaterial(o);
  // head: portrait cube (falls back to a plain colored cube if the file 404s)
  const headMat = lam({color:0xffffff});
  const tex = loader.load('static/portraits/' + id + '.webp',
    undefined, undefined,
    () => { headMat.map = null; headMat.color.set(meta.color); headMat.needsUpdate = true; });
  tex.colorSpace = THREE.SRGBColorSpace;
  headMat.map = tex; headMat.needsUpdate = true;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), headMat);
  head.position.y = 1.24;
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.3), lam({color}));
  torso.position.y = 0.75;
  const armGeo = new THREE.BoxGeometry(0.14, 0.5, 0.14);
  armGeo.translate(0, -0.25, 0);                       // pivot at the shoulder
  const armL = new THREE.Mesh(armGeo, lam({color:dark})); armL.position.set(-0.33, 0.98, 0);
  const armR = new THREE.Mesh(armGeo, lam({color:dark})); armR.position.set(0.33, 0.98, 0);
  const legGeo = new THREE.BoxGeometry(0.16, 0.5, 0.16);
  legGeo.translate(0, -0.25, 0);                       // pivot at the hip
  const legL = new THREE.Mesh(legGeo, lam({color:0x3a4356})); legL.position.set(-0.13, 0.5, 0);
  const legR = new THREE.Mesh(legGeo, lam({color:0x3a4356})); legR.position.set(0.13, 0.5, 0);
  for (const m of [head, torso, armL, armR, legL, legR]){ m.castShadow = true; group.add(m); }
  const scale = id === 'jabari' ? 1.12 : 1;            // Jabari stands a little taller
  group.scale.setScalar(scale);
  return {group, head, torso, armL, armR, legL, legR, scale};
}

/* ---------------- mouse parallax (diorama stays put) ---------------- */
const par = {x:0, y:0, tx:0, ty:0};
stage.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  par.tx = ((e.clientX - r.left) / r.width - 0.5) * 1.1;
  par.ty = ((e.clientY - r.top) / r.height - 0.5) * 0.7;
});
stage.addEventListener('mouseleave', () => { par.tx = 0; par.ty = 0; });
const camBase = camera.position.clone();

/* ---------------- animation ---------------- */
let lastT = 0;
function tick(){
  requestAnimationFrame(tick);
  const nowMs = performance.now() / 1000;
  const dt = Math.min(0.05, lastT ? nowMs - lastT : 0.016);
  lastT = nowMs;
  const t = nowMs;
  for (const id of Object.keys(chars)){
    const ch = chars[id], meta = ROSTER[id];
    const g = ch.group, p = ch.parts;
    // --- movement: walk toward dest, facing the travel direction ---
    ch.walking = false;
    if (ch.dest){
      const dx = ch.dest.x - g.position.x, dz = ch.dest.z - g.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.05){
        g.position.x = ch.dest.x; g.position.z = ch.dest.z; ch.dest = null;
      } else {
        const step = Math.min(dist, 1.4 * dt);
        g.position.x += dx / dist * step;
        g.position.z += dz / dist * step;
        g.rotation.y = Math.atan2(dx, dz);
        ch.walking = true;
      }
    }
    // --- pose: reset to neutral, then apply the state animation ---
    p.armL.rotation.x = 0; p.armR.rotation.x = 0;
    p.legL.rotation.x = 0; p.legR.rotation.x = 0;
    p.head.rotation.z = 0; g.rotation.x = 0; g.rotation.z = 0;
    g.scale.setScalar(ch.baseScale);
    g.position.y = 0;
    if (ch.walking){
      const s = Math.sin(t * 8 + ch.phase);
      p.legL.rotation.x = 0.55 * s;  p.legR.rotation.x = -0.55 * s;
      p.armL.rotation.x = -0.45 * s; p.armR.rotation.x = 0.45 * s;
      g.position.y = Math.abs(s) * 0.045;
      g.rotation.x = 0.05;
      ch.bubble.visible = false;
    } else if (ch.state === 'working'){
      g.rotation.y = ch.faceDesk;                                     // face the desk
      g.position.y = Math.abs(Math.sin(t * 7 + ch.phase)) * 0.05;     // typing bob
      p.armL.rotation.x = -0.55; p.armR.rotation.x = -0.55;            // hands forward
      ch.bubble.visible = true;
      ch.bubble.position.set(g.position.x, ch.labelY + 0.28, g.position.z);
    } else if (ch.state === 'thinking'){
      g.position.y = Math.sin(t * 1.6 + ch.phase) * 0.02;
      p.head.rotation.z = 0.16 * Math.sin(t * 1.6 + ch.phase);         // head tilt
      ch.bubble.visible = false;
    } else {
      g.scale.y = ch.baseScale * (1 + 0.008 * Math.sin(t * 1.6 + ch.phase));  // breathing
      g.rotation.z = 0.02 * Math.sin(t * 0.9 + ch.phase);                     // tiny sway
      ch.bubble.visible = false;
    }
    // --- followers: label, shadow, ring track the group ---
    ch.label.position.set(g.position.x, ch.labelY, g.position.z);
    ch.shadow.position.set(g.position.x, 0.03, g.position.z);
    ch.ring.position.set(g.position.x, 0.02, g.position.z);
    if (ch.state === 'error'){
      const pl = 1 + 0.18 * Math.sin(t * 6);
      ch.ring.scale.set(pl, pl, 1);
      ch.ring.material.color.set('#dc2626');
      ch.ring.material.opacity = 0.85;
    } else {
      ch.ring.scale.set(1, 1, 1);
      ch.ring.material.color.set(meta.color);
      ch.ring.material.opacity = 0.45;
    }
  }
  par.x += (par.tx - par.x) * 0.06;
  par.y += (par.ty - par.y) * 0.06;
  camera.position.set(camBase.x + par.x, camBase.y - par.y, camBase.z);
  camera.lookAt(0, 0.2, 0);
  renderer.render(scene, camera);
}

// working -> walk out to the open-floor task spot; idle -> walk back to the desk.
function setWalkDest(ch){
  if (ch.state === 'working' && !ch.dest) ch.dest = ch.taskSpot;
  else if (ch.state === 'idle' && !ch.dest &&
           (Math.abs(ch.group.position.x - ch.home.x) > 0.06 ||
            Math.abs(ch.group.position.z - ch.home.z) > 0.06)) ch.dest = ch.home;
}
function applyEvent(ev){
  const map = {agent_spawn:'idle', llm_start:'working', llm_end:'idle',
    tool_call:'working', handoff:'thinking', agent_idle:'idle',
    agent_error:'error', chat_message:'working'};
  if (ev.type === 'snapshot'){
    for (const a of (ev.agents || [])){
      const ch = chars[a.id]; if (!ch) continue;
      ch.state = a.state || 'idle'; ch.activity = a.last_activity || '';
      setWalkDest(ch);
    }
    updateAgentRows(ev.agents || []);
    return;
  }
  feed(ev);
  const ch = chars[ev.agent]; if (!ch) return;
  let s = map[ev.type] || ch.state;
  if (ev.type === 'chat_message' && String(ev.detail || '').startsWith('out:')) s = 'idle';
  ch.state = s;
  setWalkDest(ch);
  ch.activity = (ev.detail || '').slice(0, 90);
  const rows = Object.keys(ROSTER).map(id => ({
    id, name:ROSTER[id].name, role:ROSTER[id].role, color:ROSTER[id].color,
    state: chars[id].state, last_activity: chars[id].activity || chars[id].state,
  }));
  updateAgentRows(rows);
}

/* ---------------- @mention group chat (async, shared log, approvals) ---------------- */
const log = document.getElementById('chatlog'),
      input = document.getElementById('chatin'),
      sendBtn = document.getElementById('send');
let lastSeq = 0;                       // shared-log cursor
const typingBy = {};                   // agent id -> {el, ts}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseMentions(text){
  const seen = new Set(), out = [];
  for (const m of text.matchAll(/@([a-z]+)/gi)){
    const word = m[1].toLowerCase();
    if (word === 'everyone'){                       // @everyone: the whole Baraza
      for (const id of Object.keys(ROSTER)) if (!seen.has(id)){ seen.add(id); out.push(id); }
      continue;
    }
    if (ROSTER[word] && !seen.has(word)){ seen.add(word); out.push(word); }
  }
  return out;
}
function highlightMentions(text){
  return escapeHtml(text).replace(/@([a-zA-Z]+)/g, (m, name) => {
    const id = name.toLowerCase();
    if (id === 'everyone') return `<b class="at at-all">@${escapeHtml(name)}</b>`;
    if (!ROSTER[id]) return m;
    return `<b class="at" style="color:${ROSTER[id].color}">@${escapeHtml(name)}</b>`;
  });
}
function addOwnMsg(text){
  const d = document.createElement('div'); d.className = 'msg you';
  d.innerHTML = highlightMentions(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function addSysNote(text){
  const d = document.createElement('div'); d.className = 'msg sys';
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function addReply(id, text){
  const meta = ROSTER[id];
  const d = document.createElement('div'); d.className = 'msg them';
  d.innerHTML = `<div class="head"><img src="static/portraits/${id}.webp" alt="">
    <b style="color:${meta.color}">${meta.name}</b></div>${escapeHtml(text)}`;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function addTyping(id){
  const meta = ROSTER[id];
  const d = document.createElement('div'); d.className = 'msg typing';
  d.dataset.agent = id;
  d.innerHTML = `<img src="static/portraits/${id}.webp" alt="">
    <b style="font-size:11.5px;color:${meta.color}">${meta.name}</b>
    <span class="tdots"><i></i><i></i><i></i></span>`;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function clearTyping(id){
  const t = typingBy[id];
  if (t){ t.el.remove(); delete typingBy[id]; }
}
async function send(){
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = ''; sendBtn.disabled = true;
  const targets = parseMentions(text);
  const effTargets = targets.length ? targets : ['jabari'];
  // Typing indicators go up now; replies arrive later via pollChat.
  // (No optimistic own-message: our message echoes back from the shared log.)
  const now = Date.now();
  for (const id of effTargets){
    clearTyping(id);
    typingBy[id] = {el: addTyping(id), ts: now};
  }
  try{
    const r = await fetch('/api/chat', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({targets: effTargets, message: text})});
    const j = await r.json();
    if (j.ok){
      lastSeq = Math.max(lastSeq, j.seq || 0);
    } else {
      effTargets.forEach(clearTyping);
      addSysNote('⚠ ' + (j.error || 'chat failed'));
    }
  }catch(_){
    effTargets.forEach(clearTyping);
    addSysNote('⚠ office unreachable');
  }
  sendBtn.disabled = false; input.focus();
}
async function pollChat(){
  try{
    const r = await fetch('/api/chat/log?since=' + lastSeq);
    const j = await r.json();
    for (const e of (j.entries || [])){
      lastSeq = Math.max(lastSeq, e.seq || 0);
      if (e.author === 'human') addOwnMsg(e.text);
      else if (ROSTER[e.author]){ clearTyping(e.author); addReply(e.author, e.text); }
      else addSysNote(e.text);                       // system notes
    }
  }catch(_){}
  // Typing-indicator safety: drop anything older than 120s.
  const cutoff = Date.now() - 120000;
  for (const id of Object.keys(typingBy)) if (typingBy[id].ts < cutoff) clearTyping(id);
}
sendBtn.onclick = send;
input.onkeydown = e => { if (e.key === 'Enter') send(); };

const apprBox = document.getElementById('approvals');
const apprBadge = document.getElementById('apprBadge');
async function pollApprovals(){
  try{
    const r = await fetch('/api/approvals/pending');
    const j = await r.json();
    const list = j.pending || [];
    apprBox.innerHTML = '';
    apprBadge.classList.toggle('show', list.length > 0);
    apprBadge.textContent = list.length
      ? list.length + ' approval' + (list.length > 1 ? 's' : '') + ' pending' : '';
    for (const rec of list){
      const a = rec.action || {};
      const agentId = rec.agent || (a.payload && a.payload.agent);
      const meta = (agentId && ROSTER[agentId]) || null;
      const color = meta ? meta.color : '#8a8177';
      const pay = JSON.stringify(a.payload || {});
      const card = document.createElement('div'); card.className = 'appr';
      card.style.borderLeftColor = color;
      card.innerHTML =
        `<div class="kind" style="color:${color}">${escapeHtml(a.kind || 'action')}` +
        (meta ? ` · ${escapeHtml(meta.name)}` : '') + `</div>` +
        `<div class="sum">${escapeHtml(a.summary || '')}</div>` +
        (pay.length > 2 ? `<div class="pay">${escapeHtml(pay.slice(0, 160))}</div>` : '') +
        `<div class="row"><span class="meta">${escapeHtml(rec.requested_at || '')}</span>` +
        `<button class="ok">Approve</button><button class="no">Deny</button></div>`;
      const [okBtn, noBtn] = card.querySelectorAll('button');
      okBtn.onclick = () => decideApproval(rec.id, 'approve', card);
      noBtn.onclick = () => decideApproval(rec.id, 'deny', card);
      apprBox.appendChild(card);
    }
  }catch(_){}
}
async function decideApproval(id, verb, card){
  try{
    const r = await fetch(`/api/approvals/${encodeURIComponent(id)}/${verb}`, {method:'POST'});
    const j = await r.json();
    if (j.ok) card.remove();
  }catch(_){}
}

refreshAgents();
pollChat();                       // render shared history, set the cursor

setInterval(pollApprovals, 3000);
setInterval(refreshAgents, 8000);
